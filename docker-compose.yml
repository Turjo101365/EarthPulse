name: earthpulse

services:
  # ============================================================================
  # 1. EarthPulse Core Backend & 3D WebGIS Application (FastAPI + CesiumJS)
  # ============================================================================
  backend:
    container_name: earthpulse-backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8050
      GOOGLE_EARTH_API_KEY: ${GOOGLE_EARTH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-EarthPulse3D}
      DATABASE_URL: ${DATABASE_URL:-postgresql://earthpulse:earthpulse@postgres:5432/earthpulse}
    ports:
      - "${PORT:-8050}:8050"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./knowledge:/app/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8050/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - earthpulse-net

  # ============================================================================
  # 2. PostgreSQL + pgvector Relational & Vector Database
  # ============================================================================
  postgres:
    container_name: earthpulse-postgres
    image: pgvector/pgvector:pg16
    environment:

      POSTGRES_DB: ${POSTGRES_DB:-earthpulse}
      POSTGRES_USER: ${POSTGRES_USER:-earthpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-earthpulse}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - earthpulse-pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-earthpulse} -d ${POSTGRES_DB:-earthpulse}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - earthpulse-net

  # ============================================================================
  # 3. pgAdmin 4 - Web UI for PostgreSQL Administration
  # ============================================================================
  pgadmin:
    container_name: earthpulse-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@earthpulse.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - earthpulse-net

  # ============================================================================
  # 3b. Adminer - Lightweight Zero-Config Database Manager (Port 8083)
  # ============================================================================
  adminer:
    container_name: earthpulse-adminer
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - earthpulse-net

  # ============================================================================
  # 4. Prometheus - Real-time Metrics & Telemetry Scraper
  # ============================================================================

  prometheus:
    container_name: earthpulse-prometheus
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - earthpulse-net

  # ============================================================================
  # 5. Grafana - Telemetry Dashboards & Visualization
  # ============================================================================
  grafana:
    container_name: earthpulse-grafana
    image: grafana/grafana:11.3.0
    environment:

      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - earthpulse-grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3005}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - earthpulse-net

volumes:
  earthpulse-pgdata:
  earthpulse-grafanadata:

networks:
  earthpulse-net:
    driver: bridge
