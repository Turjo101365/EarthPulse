global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "fireguard-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8050", "localhost:8050"]
        labels:
          app: "fireguard-ai"
          environment: "mission-control"
